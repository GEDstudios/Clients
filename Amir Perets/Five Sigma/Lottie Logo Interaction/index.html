<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lottie Hover Demo</title>

  <style>
    body {
      display: flex;
      gap: 40px;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #eee;
    }

    .lottie {
      width: 350px;
      height: 350px;
      padding: 100px;
    }

    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div class="lottie" data-file="Logotype.lottie">
    <canvas></canvas>
  </div>

  <div class="lottie" data-file="Symbol.lottie">
    <canvas></canvas>
  </div>


  <script type="module">
    import { DotLottie } from "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web/+esm";

    document.querySelectorAll(".lottie").forEach(box => {

      const lottie = new DotLottie({
        canvas: box.querySelector("canvas"),
        src: box.dataset.file,
        autoplay: false,
        loop: false
      });

      let oneSecondFrame;
      let endFrame;
      let playingIntro = true;

      lottie.addEventListener("load", () => {

        // Find which frame is exactly 1 second
        oneSecondFrame = Math.round(
          lottie.totalFrames / lottie.duration
        );

        endFrame = lottie.totalFrames - 1;

        // Play intro: 0s → 1s
        lottie.setSegment(0, oneSecondFrame);
        lottie.play();
      });


      lottie.addEventListener("complete", () => {

        // After intro or interaction,
        // always freeze on the 1-second frame
        lottie.pause();
        lottie.setFrame(oneSecondFrame);

        playingIntro = false;
      });


      box.addEventListener("mouseenter", () => {

        // Don't interrupt the first intro
        if (playingIntro) return;

        // Restart interaction from 1s
        lottie.pause();
        lottie.setSegment(oneSecondFrame, endFrame);
        lottie.setFrame(oneSecondFrame);
        lottie.play();
      });


      // No mouseleave code:
      // once started, the interaction keeps playing to the end.

    });
  </script>

</body>
</html>
