<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dotLottie Hover Interaction Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
    }

    .players {
      width: min(1100px, calc(100% - 40px));
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .lottie {
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
    }

    .lottie canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 700px) {
      .players {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="players">
    <div class="lottie" data-src="./Logotype.lottie">
      <canvas></canvas>
    </div>

    <div class="lottie" data-src="./Symbol.lottie">
      <canvas></canvas>
    </div>
  </main>

  <script type="module">
    import { DotLottie } from "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web/+esm";

    const HOLD_TIME_SECONDS = 1;

    function createInteractiveLottie(container) {
      const canvas = container.querySelector("canvas");
      const src = container.dataset.src;

      let state = "loading"; // loading | intro | idle | interaction
      let isHovered = false;
      let holdFrame = 0;
      let endFrame = 0;

      const animation = new DotLottie({
        canvas,
        src,
        autoplay: false,
        loop: false,
        renderConfig: {
          autoResize: true,
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        },
      });

      function freezeAtHoldFrame() {
        animation.pause();
        animation.resetSegment();
        animation.setFrame(holdFrame);
        state = "idle";
      }

      function playInteraction() {
        if (state === "intro" || state === "loading") return;

        state = "interaction";

        // Always restart the interaction from the 1-second frame.
        animation.pause();
        animation.setSegment(holdFrame, endFrame);
        animation.setFrame(holdFrame);

        // Wait one browser tick so the seek is definitely applied first.
        requestAnimationFrame(() => {
          animation.play();
        });
      }

      animation.addEventListener("load", () => {
        const duration = animation.duration;       // seconds
        const totalFrames = animation.totalFrames;

        if (!duration || !totalFrames) return;

        endFrame = Math.max(0, totalFrames - 1);

        // Convert exactly 1.0 second to the matching frame,
        // independent of whether the animation is 24/25/30/60 fps.
        holdFrame = Math.min(
          endFrame,
          Math.round((HOLD_TIME_SECONDS / duration) * totalFrames)
        );

        state = "intro";

        // PAGE LOAD:
        // Play only 0:00 -> 1:00.
        animation.setSegment(0, holdFrame);
        animation.setFrame(0);

        requestAnimationFrame(() => {
          animation.play();
        });
      });

      animation.addEventListener("complete", () => {
        if (state === "intro") {
          // Intro finished: hold the exact 1-second frame.
          freezeAtHoldFrame();

          // If the pointer entered while the intro was still playing,
          // immediately begin the interaction after the intro completes.
          if (isHovered) {
            playInteraction();
          }

          return;
        }

        if (state === "interaction") {
          // Interaction finished:
          // jump back to the static 1-second state and freeze there.
          freezeAtHoldFrame();
        }
      });

      container.addEventListener("pointerenter", () => {
        isHovered = true;

        // If idle: play interaction.
        // If already playing interaction: restart it from 1 second.
        if (state === "idle" || state === "interaction") {
          playInteraction();
        }
      });

      container.addEventListener("pointerleave", () => {
        isHovered = false;

        // Intentionally do nothing.
        // The interaction keeps playing all the way to the end.
      });

      return animation;
    }

    document.querySelectorAll(".lottie").forEach(createInteractiveLottie);
  </script>
</body>
</html>
