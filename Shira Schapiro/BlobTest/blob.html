<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Metallic Blob</title>
<style>
body {
margin: 0;
overflow: hidden;
background: #050505;
cursor: grab;
touch-action: none; 
}
body:active {
cursor: grabbing;
}
canvas {
    background: linear-gradient(0deg, #14081c 0%, #7155c6 100%);
display: block;
}
</style>
</head>
<body>
<script type="importmap">
{
"imports": {
"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}
}
</script>

<script type="module">
import * as THREE from 'three';
import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// 1. Core Setup
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 4.5);

const textureLoader = new THREE.TextureLoader();
textureLoader.load('hdri.jpg', (texture) => {
    texture.mapping = THREE.EquirectangularReflectionMapping;
    texture.colorSpace = THREE.SRGBColorSpace;
    scene.environment = texture;
});

// 3. Geometry & Material
let geometry = new THREE.IcosahedronGeometry(1, 64);
geometry = mergeVertices(geometry);

const material = new THREE.MeshPhysicalMaterial({
color: 0xdddddd,
metalness: 1.0,
roughness: 0.125,
clearcoat: 0.5,
clearcoatRoughness: 1
});

const blob = new THREE.Mesh(geometry, material);
scene.add(blob);

// 4. Performance Caching
const simplex = new SimplexNoise();
const positionAttribute = geometry.attributes.position;
const count = positionAttribute.count;

const basePos = new Float32Array(count * 3);
for (let i = 0; i < count; i++) {
basePos[i * 3] = positionAttribute.getX(i);
basePos[i * 3 + 1] = positionAttribute.getY(i);
basePos[i * 3 + 2] = positionAttribute.getZ(i);
}
const posArray = positionAttribute.array;

// 5. Clean Rotation Interaction
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };
const targetRotation = new THREE.Vector2(0, 0);

window.addEventListener('pointerdown', (e) => {
isDragging = true;
previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('pointerup', () => {
isDragging = false;
});

window.addEventListener('pointermove', (e) => {
if (isDragging) {
const deltaMove = {
x: e.clientX - previousMousePosition.x,
y: e.clientY - previousMousePosition.y
};

targetRotation.x += deltaMove.y * 0.005;
targetRotation.y += deltaMove.x * 0.005;

previousMousePosition = { x: e.clientX, y: e.clientY };
}
});

// 6. Optimized Animation Loop
const clock = new THREE.Clock();

function animate() {
requestAnimationFrame(animate);

// Smooth rotation easing
blob.rotation.x = THREE.MathUtils.lerp(blob.rotation.x, targetRotation.x, 0.05);
blob.rotation.y = THREE.MathUtils.lerp(blob.rotation.y, targetRotation.y, 0.05);

const t = clock.getElapsedTime() * 0.4;

for (let i = 0; i < count; i++) {
const i3 = i * 3;
const bx = basePos[i3];
const by = basePos[i3 + 1];
const bz = basePos[i3 + 2];

const noise = simplex.noise3d(bx + t, by + t, bz);
const displacement = 1 + (noise * 0.1);

posArray[i3] = bx * displacement;
posArray[i3 + 1] = by * displacement;
posArray[i3 + 2] = bz * displacement;
}

positionAttribute.needsUpdate = true;
geometry.computeVertexNormals();

renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
