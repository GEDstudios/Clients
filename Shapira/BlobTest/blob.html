<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Premium Metallic Blob</title>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
}

body {
  cursor: grab;
  touch-action: none;
}

body:active {
  cursor: grabbing;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  background: linear-gradient(0deg, #14081c 0%, #7155c6 100%);
}
</style>
</head>

<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);

const renderer = new THREE.WebGLRenderer({
  antialias: !isMobile,
  alpha: false,
  powerPreference: 'high-performance',
  stencil: false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.35 : 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 0, 4.5);

// Environment reflection.
// Keep hdri.jpg small. Prefer a compressed, low-resolution image for web.
const textureLoader = new THREE.TextureLoader();

textureLoader.load(
  'hdri.jpg',
  (texture) => {
    texture.mapping = THREE.EquirectangularReflectionMapping;
    texture.colorSpace = THREE.SRGBColorSpace;
    scene.environment = texture;
  },
  undefined,
  () => {
    // Fallback: blob still looks metallic even if the HDRI fails.
    scene.environment = null;
  }
);

// Lower geometry detail keeps the same blob look but avoids huge per-frame CPU work.
const detail = isMobile ? 24 : 32;

let geometry = new THREE.IcosahedronGeometry(1, detail);
geometry = mergeVertices(geometry);

const positionAttribute = geometry.attributes.position;
positionAttribute.setUsage(THREE.DynamicDrawUsage);

const count = positionAttribute.count;
const posArray = positionAttribute.array;

const basePos = new Float32Array(count * 3);

for (let i = 0; i < count; i++) {
  const i3 = i * 3;
  basePos[i3] = posArray[i3];
  basePos[i3 + 1] = posArray[i3 + 1];
  basePos[i3 + 2] = posArray[i3 + 2];
}

const material = new THREE.MeshPhysicalMaterial({
  color: 0xdddddd,
  metalness: 1.0,
  roughness: 0.125,
  clearcoat: 0.5,
  clearcoatRoughness: 1.0
});

const blob = new THREE.Mesh(geometry, material);
scene.add(blob);

const simplex = new SimplexNoise();
const clock = new THREE.Clock();

let isDragging = false;
let previousX = 0;
let previousY = 0;

const targetRotation = new THREE.Vector2(0, 0);

renderer.domElement.addEventListener('pointerdown', (e) => {
  isDragging = true;
  previousX = e.clientX;
  previousY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointerup', (e) => {
  isDragging = false;

  if (renderer.domElement.hasPointerCapture(e.pointerId)) {
    renderer.domElement.releasePointerCapture(e.pointerId);
  }
});

renderer.domElement.addEventListener('pointercancel', () => {
  isDragging = false;
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!isDragging) return;

  const deltaX = e.clientX - previousX;
  const deltaY = e.clientY - previousY;

  targetRotation.x += deltaY * 0.005;
  targetRotation.y += deltaX * 0.005;

  previousX = e.clientX;
  previousY = e.clientY;
});

let frame = 0;
let running = true;

function animate() {
  if (!running) return;

  requestAnimationFrame(animate);

  blob.rotation.x = THREE.MathUtils.lerp(blob.rotation.x, targetRotation.x, 0.05);
  blob.rotation.y = THREE.MathUtils.lerp(blob.rotation.y, targetRotation.y, 0.05);

  const t = clock.getElapsedTime() * 0.4;

  for (let i = 0; i < count; i++) {
    const i3 = i * 3;

    const bx = basePos[i3];
    const by = basePos[i3 + 1];
    const bz = basePos[i3 + 2];

    const noise = simplex.noise3d(bx + t, by + t, bz);
    const displacement = 1 + noise * 0.1;

    posArray[i3] = bx * displacement;
    posArray[i3 + 1] = by * displacement;
    posArray[i3 + 2] = bz * displacement;
  }

  positionAttribute.needsUpdate = true;

  // Normal recomputation is expensive.
  // Every other frame keeps the metallic highlights close to the original look
  // while cutting a large amount of CPU work.
  if (frame % 2 === 0) {
    geometry.computeVertexNormals();
  }

  frame++;

  renderer.render(scene, camera);
}

let resizeQueued = false;

window.addEventListener('resize', () => {
  if (resizeQueued) return;

  resizeQueued = true;

  requestAnimationFrame(() => {
    resizeQueued = false;

    const width = window.innerWidth;
    const height = window.innerHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.35 : 1.75));
    renderer.setSize(width, height);
  });
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    running = false;
  } else {
    running = true;
    clock.getDelta();
    animate();
  }
});

animate();
</script>
</body>
</html>
