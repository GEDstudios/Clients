<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Metallic Blob</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
    }

    body {
      cursor: grab;
      touch-action: none;
    }

    body:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100dvh;
    }
  </style>
</head>

<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';

    const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);

    const renderer = new THREE.WebGLRenderer({
      antialias: !isMobile,
      alpha: false,
      powerPreference: 'high-performance',
      stencil: false
    });

    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0, 4.5);

    const textureLoader = new THREE.TextureLoader();

    textureLoader.load('hdri.jpg', (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      texture.colorSpace = THREE.SRGBColorSpace;
      scene.environment = texture;
    });

    const detail = isMobile ? 18 : 28;

    const geometry = new THREE.IcosahedronGeometry(1, detail);
    const positionAttribute = geometry.attributes.position;

    positionAttribute.setUsage(THREE.DynamicDrawUsage);

    const vertexCount = positionAttribute.count;
    const positions = positionAttribute.array;
    const basePositions = new Float32Array(positions);

    const material = new THREE.MeshPhysicalMaterial({
      color: 0xdddddd,
      metalness: 1,
      roughness: 0.125,
      clearcoat: 0.5,
      clearcoatRoughness: 1
    });

    const blob = new THREE.Mesh(geometry, material);
    scene.add(blob);

    const simplex = new SimplexNoise();
    const clock = new THREE.Clock();

    const targetRotation = new THREE.Vector2(0, 0);

    let isDragging = false;
    let previousX = 0;
    let previousY = 0;
    let frame = 0;
    let animationId = null;

    function getViewportSize() {
      const viewport = window.visualViewport;

      return {
        width: viewport?.width || window.innerWidth,
        height: viewport?.height || window.innerHeight
      };
    }

    function updateSize() {
      const { width, height } = getViewportSize();
      const pixelRatio = Math.min(window.devicePixelRatio || 1, isMobile ? 1.25 : 1.75);

      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(width, height, false);

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      blob.scale.setScalar(width < 600 ? 0.78 : 1);
    }

    function updateBlob() {
      const t = clock.getElapsedTime() * 0.4;

      for (let i = 0; i < vertexCount; i++) {
        const i3 = i * 3;

        const x = basePositions[i3];
        const y = basePositions[i3 + 1];
        const z = basePositions[i3 + 2];

        const noise = simplex.noise3d(x + t, y + t, z);
        const displacement = 1 + noise * 0.1;

        positions[i3] = x * displacement;
        positions[i3 + 1] = y * displacement;
        positions[i3 + 2] = z * displacement;
      }

      positionAttribute.needsUpdate = true;

      if (frame % (isMobile ? 3 : 2) === 0) {
        geometry.computeVertexNormals();
      }

      frame++;
    }

    function animate() {
      animationId = requestAnimationFrame(animate);

      blob.rotation.x = THREE.MathUtils.lerp(blob.rotation.x, targetRotation.x, 0.06);
      blob.rotation.y = THREE.MathUtils.lerp(blob.rotation.y, targetRotation.y, 0.06);

      updateBlob();
      renderer.render(scene, camera);
    }

    function startAnimation() {
      if (animationId === null) {
        clock.getDelta();
        animate();
      }
    }

    function stopAnimation() {
      if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
    }

    renderer.domElement.addEventListener('pointerdown', (event) => {
      isDragging = true;
      previousX = event.clientX;
      previousY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener('pointermove', (event) => {
      if (!isDragging) return;

      const deltaX = event.clientX - previousX;
      const deltaY = event.clientY - previousY;

      targetRotation.x += deltaY * 0.005;

      // Inverted so dragging right visually turns the blob right.
      targetRotation.y -= deltaX * 0.005;

      previousX = event.clientX;
      previousY = event.clientY;
    });

    renderer.domElement.addEventListener('pointerup', (event) => {
      isDragging = false;

      if (renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    });

    renderer.domElement.addEventListener('pointercancel', () => {
      isDragging = false;
    });

    let resizeQueued = false;

    function queueResize() {
      if (resizeQueued) return;

      resizeQueued = true;

      requestAnimationFrame(() => {
        resizeQueued = false;
        updateSize();
      });
    }

    window.addEventListener('resize', queueResize);
    window.visualViewport?.addEventListener('resize', queueResize);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopAnimation();
      } else {
        startAnimation();
      }
    });

    updateSize();
    startAnimation();
  </script>
</body>
</html>
