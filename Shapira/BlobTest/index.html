<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Premium Metallic Blob</title>
<style>
  * { box-sizing: border-box; }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
  }

  body {
    cursor: grab;
    touch-action: none;
    overscroll-behavior: none;
  }

  body:active { cursor: grabbing; }

  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100dvh;
  }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';

const isMobile = matchMedia('(max-width: 700px), (pointer: coarse)').matches;
const maxPixelRatio = isMobile ? 1.25 : 1.75;
const geometryDetail = isMobile ? 20 : 32;
const normalUpdateInterval = isMobile ? 3 : 2;

const renderer = new THREE.WebGLRenderer({
  antialias: !isMobile,
  powerPreference: 'high-performance',
  stencil: false,
  depth: true
});

renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.z = 4.8;

new THREE.TextureLoader().load('hdri.jpg', (texture) => {
  texture.mapping = THREE.EquirectangularReflectionMapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  scene.environment = texture;
});

const geometry = new THREE.IcosahedronGeometry(1, geometryDetail);
const position = geometry.attributes.position;
const vertices = position.array;
const baseVertices = vertices.slice();

position.setUsage(THREE.DynamicDrawUsage);

const blob = new THREE.Mesh(
  geometry,
  new THREE.MeshPhysicalMaterial({
    color: 0xdddddd,
    metalness: 1,
    roughness: 0.125,
    clearcoat: 0.5,
    clearcoatRoughness: 1
  })
);

scene.add(blob);

const clock = new THREE.Clock();
const noise = new SimplexNoise();
const targetRotation = new THREE.Vector2();
const pointer = { active: false, x: 0, y: 0 };

let frame = 0;
let rafId = 0;
let resizeId = 0;

function resize() {
  const width = window.innerWidth;
  const height = window.visualViewport?.height || window.innerHeight;

  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, maxPixelRatio));
  renderer.setSize(width, height, false);

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  const narrowScreen = width < 520;
  blob.scale.setScalar(narrowScreen ? 0.82 : 1);
  camera.position.z = narrowScreen ? 5.3 : 4.8;
}

function updateBlob(time) {
  for (let i = 0; i < position.count; i++) {
    const j = i * 3;
    const x = baseVertices[j];
    const y = baseVertices[j + 1];
    const z = baseVertices[j + 2];
    const displacement = 1 + noise.noise3d(x + time, y + time, z) * 0.1;

    vertices[j] = x * displacement;
    vertices[j + 1] = y * displacement;
    vertices[j + 2] = z * displacement;
  }

  position.needsUpdate = true;

  if (frame % normalUpdateInterval === 0) {
    geometry.computeVertexNormals();
  }
}

function animate() {
  rafId = requestAnimationFrame(animate);

  blob.rotation.x = THREE.MathUtils.lerp(blob.rotation.x, targetRotation.x, 0.05);
  blob.rotation.y = THREE.MathUtils.lerp(blob.rotation.y, targetRotation.y, 0.05);

  updateBlob(clock.getElapsedTime() * 0.4);
  renderer.render(scene, camera);
  frame++;
}

function start() {
  if (!rafId) animate();
}

function stop() {
  cancelAnimationFrame(rafId);
  rafId = 0;
}

renderer.domElement.addEventListener('pointerdown', (event) => {
  pointer.active = true;
  pointer.x = event.clientX;
  pointer.y = event.clientY;
  renderer.domElement.setPointerCapture(event.pointerId);
});

renderer.domElement.addEventListener('pointermove', (event) => {
  if (!pointer.active) return;

  targetRotation.x += (event.clientY - pointer.y) * 0.005;
  targetRotation.y += (event.clientX - pointer.x) * 0.005;

  pointer.x = event.clientX;
  pointer.y = event.clientY;
});

renderer.domElement.addEventListener('pointerup', (event) => {
  pointer.active = false;
  renderer.domElement.releasePointerCapture(event.pointerId);
});

renderer.domElement.addEventListener('pointercancel', () => {
  pointer.active = false;
});

window.addEventListener('resize', () => {
  cancelAnimationFrame(resizeId);
  resizeId = requestAnimationFrame(resize);
});

window.visualViewport?.addEventListener('resize', resize);

document.addEventListener('visibilitychange', () => {
  document.hidden ? stop() : start();
});

resize();
start();
</script>
</body>
</html>
