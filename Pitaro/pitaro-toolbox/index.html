      <span class="product">Toolbox</span>

    <span class="spacer"></span>

    <div class="byline">
      <span class="byline-pre">By</span>
      <a href="https://x10guy.studio" target="_blank" rel="noopener">Guy&nbsp;X10</a>
    </div>
  </header>

  <main class="work">

    <div class="canvas-side">
      <div class="stage-fit is-empty" id="fit">
        <div class="empty">
          <span class="bar"></span>
          <div class="e1">Pick a template</div>
          <div class="e2">Your video will appear here</div>
        </div>
      </div>

      <div class="transport hidden" id="transport">
        <button class="iconbtn" id="btnPlay" aria-label="Play">
          <svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>
        </button>
        <input type="range" class="scrub" id="scrub" min="0" max="6" step="0.01" value="0" aria-label="Scrub through the video">
        <span class="time" id="time">0:00.0 / 0:06.0</span>
      </div>
    </div>

    <aside class="rail" id="railBody" aria-label="Steps"></aside>

  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="assets/js/app.js"></script>
<noscript>
  <p style="padding:24px">The Pitaro Toolbox needs JavaScript switched on.</p>
</noscript>

</html>
