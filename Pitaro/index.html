<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f5f5f3" />
  <title>Toolbox Composer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">T</div>
        <div class="brand-copy">
          <strong>Toolbox Composer</strong>
          <span>Social video editor</span>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="exportButton" class="export-button" type="button" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0 3.5-3.5M10 12 6.5 8.5M4 14.5V17h12v-2.5"/></svg>
          Export MP4
        </button>
      </div>
    </header>

    <main class="editor-layout">
      <aside class="inspector" aria-label="Properties inspector">
        <section class="inspector-section content-section">
          <div class="section-title">Layer</div>
          <div class="mode-switch" role="group" aria-label="Layer type">
            <button id="textMode" class="mode-button is-active" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4h10M10 4v12M7 16h6"/></svg>
              Text
            </button>
            <button id="mediaMode" class="mode-button" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="4" width="13" height="12" rx="1.5"/><circle cx="8" cy="8" r="1.2"/><path d="m5.5 14 3-3 2 2 1.8-1.8 2.2 2.8"/></svg>
              Media
            </button>
          </div>
        </section>

        <section id="textInspector" class="inspector-section">
          <div class="section-heading">
            <div class="section-title">Typography</div>
            <button id="editTextButton" class="quiet-button" type="button">Edit text</button>
          </div>

          <div class="control-stack">
            <label class="control-label" for="fontSelect">Font <span>selection</span></label>
            <div class="select-shell">
              <select id="fontSelect">
                <option value="EzerLight">Ezer Standard · Light</option>
                <option value="EzerBook">Ezer Standard · Book</option>
                <option value="EzerRegular">Ezer Standard · Regular</option>
                <option value="EzerSemiBold" selected>Ezer Standard · SemiBold</option>
                <option value="Gestura">Gestura Text · Black Italic</option>
              </select>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 6 3 3 3-3"/></svg>
            </div>

            <div class="split-row">
              <label class="field-card">
                <span class="field-prefix">T</span>
                <input id="fontSize" type="number" min="16" max="300" step="1" value="80" aria-label="Font size" />
                <small>px</small>
              </label>
              <label class="field-card color-card" title="Text color">
                <input id="colorPicker" type="color" value="#f3f3f3" aria-label="Text color" />
                <input id="colorHex" type="text" value="#F3F3F3" maxlength="7" spellcheck="false" aria-label="Text color hex" />
              </label>
            </div>

            <div class="align-row" role="group" aria-label="Text alignment">
              <button class="align-button" type="button" data-align="left" aria-label="Align left"><svg viewBox="0 0 18 18"><path d="M3 5h12M3 9h8M3 13h10"/></svg></button>
              <button class="align-button is-active" type="button" data-align="center" aria-label="Align center"><svg viewBox="0 0 18 18"><path d="M3 5h12M5 9h8M4 13h10"/></svg></button>
              <button class="align-button" type="button" data-align="right" aria-label="Align right"><svg viewBox="0 0 18 18"><path d="M3 5h12M7 9h8M5 13h10"/></svg></button>
            </div>

            <details class="advanced-panel">
              <summary>Spacing</summary>
              <div class="advanced-grid">
                <label>
                  <span>Tracking</span>
                  <div class="mini-field"><input id="tracking" type="number" min="-10" max="80" step="1" value="0" /><small>px</small></div>
                </label>
                <label>
                  <span>Line height</span>
                  <div class="mini-field"><input id="lineHeight" type="number" min="70" max="200" step="1" value="108" /><small>%</small></div>
                </label>
              </div>
            </details>
          </div>
        </section>

        <section id="mediaInspector" class="inspector-section is-hidden">
          <div class="section-title">Media</div>
          <label id="uploadDrop" class="upload-drop" for="mediaInput">
            <input id="mediaInput" type="file" accept="image/*,video/*,.mov,.mkv,.webm,.mp4,.m4v,.avi" />
            <svg viewBox="0 0 22 22" aria-hidden="true"><path d="M11 15V5m0 0L7.5 8.5M11 5l3.5 3.5M4 15v2.5h14V15"/></svg>
            <strong id="uploadLabel">Choose image or video</strong>
            <span>or drop a file here</span>
          </label>
          <button id="removeMedia" class="danger-quiet is-hidden" type="button">Remove media</button>
        </section>

        <section class="inspector-section">
          <div class="section-heading">
            <div class="section-title">Position & size</div>
            <button id="centerObject" class="icon-button" type="button" title="Center object" aria-label="Center object">
              <svg viewBox="0 0 18 18"><path d="M9 2.5v13M2.5 9h13M5 5H3.5v1.5M13 5h1.5v1.5M5 13H3.5v-1.5M13 13h1.5v-1.5"/></svg>
            </button>
          </div>

          <div class="transform-grid">
            <label class="numeric-field"><span>X</span><input id="xField" type="number" min="-50" max="150" step="0.1" value="50" /><small>%</small></label>
            <label class="numeric-field"><span>Y</span><input id="yField" type="number" min="-50" max="150" step="0.1" value="50" /><small>%</small></label>
            <label class="numeric-field"><span>W</span><input id="widthField" type="number" min="100" max="1080" step="1" value="1000" /><small>px</small></label>
            <label class="numeric-field"><span>S</span><input id="scaleField" type="number" min="10" max="300" step="1" value="100" /><small>%</small></label>
          </div>

        </section>

        <section class="inspector-section output-summary">
          <div class="output-row"><span>Output</span><strong>1080 × 1920</strong></div>
          <div class="output-row"><span>Frame rate</span><strong>30 fps</strong></div>
          <div class="output-row"><span>Audio</span><strong>Background only</strong></div>
        </section>
      </aside>

      <section class="canvas-area" aria-label="Composition preview">
        <div class="canvas-toolbar">
          <div></div>
          <div class="zoom-label">Fit</div>
        </div>

        <div class="stage-wrap">
          <div id="stage" class="stage" tabindex="0">
            <div id="missingAssets" class="missing-assets">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m8 15 3-3 2 2 2-2 2 3"/></svg>
              <strong>Add template videos</strong>
              <span><code>assets/bg.webm</code> + <code>assets/fg.webm</code></span>
            </div>

            <video id="bgVideo" class="stage-video stage-bg" playsinline preload="auto"></video>

            <div id="object" class="editor-object is-selected" data-mode="text">
              <div id="objectContent" class="object-content">
                <div id="editableText" class="editable-text" contenteditable="false" spellcheck="false"><span style="font-family:EzerSemiBold">Meet your new </span><span style="font-family:Gestura">Toolbox</span></div>
                <img id="mediaImage" class="media-preview is-hidden" alt="Uploaded media" />
                <video id="mediaVideo" class="media-preview is-hidden" playsinline muted preload="metadata"></video>
              </div>

              <div id="selectionBox" class="selection-box" aria-hidden="true">
                <div class="selection-tag">TEXT</div>
                <button class="resize-handle corner nw" data-handle="scale" type="button" tabindex="-1"></button>
                <button class="resize-handle corner ne" data-handle="scale" type="button" tabindex="-1"></button>
                <button class="resize-handle corner sw" data-handle="scale" type="button" tabindex="-1"></button>
                <button class="resize-handle corner se" data-handle="scale" type="button" tabindex="-1"></button>
                <button class="resize-handle side west" data-handle="width-left" type="button" tabindex="-1"></button>
                <button class="resize-handle side east" data-handle="width-right" type="button" tabindex="-1"></button>
              </div>
            </div>

            <video id="fgVideo" class="stage-video stage-fg" playsinline muted preload="auto"></video>
          </div>
        </div>

        <div class="transport-bar">
          <button id="playPause" class="transport-play" type="button" disabled aria-label="Play preview">
            <svg id="playGlyph" viewBox="0 0 20 20"><path d="m7 5 8 5-8 5z"/></svg>
          </button>
          <span id="timeNow" class="timecode">00:00.00</span>
          <input id="timeline" class="timeline" type="range" min="0" max="1" step="0.001" value="0" disabled aria-label="Timeline" />
          <span id="timeTotal" class="timecode">00:00.00</span>
        </div>
      </section>
    </main>

    <div id="exportOverlay" class="export-overlay is-hidden" aria-live="polite">
      <div class="export-dialog">
        <div class="export-spinner"></div>
        <strong id="exportTitle">Rendering video</strong>
        <span id="exportDetail">Preparing frames…</span>
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        <div class="progress-meta"><span>1080 × 1920 · 30 fps</span><span id="progressPercent">0%</span></div>
      </div>
    </div>

    <div id="toast" class="toast" role="status"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
